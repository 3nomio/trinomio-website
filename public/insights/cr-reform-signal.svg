<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background -->
  <rect width="1200" height="675" fill="#020B17"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#17D7FF" stroke-width="0.3" opacity="0.12"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Background gradient glow -->
  <radialGradient id="glow1" cx="30%" cy="40%" r="45%">
    <stop offset="0%" stop-color="#17D7FF" stop-opacity="0.09"/>
    <stop offset="100%" stop-color="#17D7FF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="72%" cy="62%" r="40%">
    <stop offset="0%" stop-color="#609DFF" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#609DFF" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="675" fill="url(#glow1)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>

  <!-- Left block: reform stall signal — dashed arc -->
  <circle cx="340" cy="338" r="180" stroke="#17D7FF" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.30"/>
  <circle cx="340" cy="338" r="120" stroke="#17D7FF" stroke-width="1" stroke-dasharray="6 10" opacity="0.20"/>
  <circle cx="340" cy="338" r="60" stroke="#17D7FF" stroke-width="1" opacity="0.18"/>

  <!-- Center dot — the signal -->
  <circle cx="340" cy="338" r="7" fill="#17D7FF" opacity="0.90"/>
  <circle cx="340" cy="338" r="14" fill="#17D7FF" opacity="0.18"/>
  <circle cx="340" cy="338" r="22" fill="#17D7FF" opacity="0.08"/>

  <!-- Arrow / flow from signal to right side -->
  <path d="M 540 338 L 660 338" stroke="url(#flowGrad)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 650 328 L 665 338 L 650 348" stroke="#3FE083" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#17D7FF" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#3FE083" stop-opacity="0.9"/>
  </linearGradient>

  <!-- Right block: investment gap / opportunity -->
  <!-- Vertical bars representing investment gap -->
  <rect x="740" y="210" width="36" height="256" rx="2" fill="#17D7FF" opacity="0.12"/>
  <rect x="740" y="270" width="36" height="196" rx="2" fill="#17D7FF" opacity="0.22"/>

  <rect x="800" y="180" width="36" height="286" rx="2" fill="#609DFF" opacity="0.12"/>
  <rect x="800" y="220" width="36" height="246" rx="2" fill="#609DFF" opacity="0.20"/>

  <rect x="860" y="150" width="36" height="316" rx="2" fill="#3FE083" opacity="0.12"/>
  <rect x="860" y="180" width="36" height="286" rx="2" fill="#3FE083" opacity="0.28"/>

  <rect x="920" y="120" width="36" height="346" rx="2" fill="#17D7FF" opacity="0.10"/>
  <rect x="920" y="150" width="36" height="316" rx="2" fill="#17D7FF" opacity="0.22"/>

  <!-- Gap indicator — bracket at top -->
  <path d="M 740 170 L 740 150 L 956 150 L 956 170" stroke="#3FE083" stroke-width="1.5" fill="none" opacity="0.55"/>

  <!-- Horizontal baseline -->
  <line x1="700" y1="466" x2="1000" y2="466" stroke="#E2E6E9" stroke-width="0.8" opacity="0.18"/>

  <!-- Top label area — CR flag color accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#topBar)"/>
  <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#17D7FF" stop-opacity="0"/>
    <stop offset="30%" stop-color="#17D7FF" stop-opacity="0.8"/>
    <stop offset="70%" stop-color="#3FE083" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#3FE083" stop-opacity="0"/>
  </linearGradient>

  <!-- Bottom label line -->
  <rect x="0" y="672" width="1200" height="3" fill="url(#topBar)" opacity="0.4"/>
</svg>
